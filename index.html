<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Átomo de Silicio Animado</title>
  <style>
    body {
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .atom-container {
      position: relative;
      width: 400px;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .nucleus {
      position: absolute;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #ff4d4d 0%, #cc0000 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(255, 77, 77, 0.6);
      animation: pulse 2s infinite ease-in-out;
      z-index: 10;
    }
    .proton, .neutron {
      position: absolute;
      font-size: 11px;
      font-weight: bold;
      color: white;
    }
    .proton { top: 20px; left: 15px; }
    .neutron { bottom: 20px; right: 15px; }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 77, 77, 0.5); }
      50% { transform: scale(1.08); box-shadow: 0 0 25px rgba(255, 77, 77, 0.8); }
      100% { transform: scale(1); box-shadow: 0 0 15px rgba(255, 77, 77, 0.5); }
    }
    .orbit {
      position: absolute;
      border: 1px dashed rgba(255, 255, 255, 0.3);
      border-radius: 50%;
    }
    .orbit-1 { width: 140px; height: 140px; animation: spin 8s linear infinite; }
    .orbit-2 { width: 260px; height: 260px; animation: spin-reverse 14s linear infinite; }
    .orbit-3 { width: 380px; height: 380px; animation: spin 20s linear infinite; }
    .electron {
      position: absolute;
      width: 22px;
      height: 22px;
      background: radial-gradient(circle, #94a3b8 0%, #475569 100%);
      border-radius: 50%;
      font-size: 9px;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 8px rgba(148, 163, 184, 0.8);
    }
    .e-1 { top: -11px; left: 59px; }
    .e-2 { bottom: -11px; left: 59px; }
    .e-3 { top: -11px; left: 119px; }
    .e-4 { bottom: -11px; left: 119px; }
    .e-5 { top: 38px; left: -11px; }
    .e-6 { bottom: 38px; left: -11px; }
    .e-7 { top: 38px; right: -11px; }
    .e-8 { bottom: 38px; right: -11px; }
    .e-9 { top: 100px; left: -11px; }
    .e-10 { bottom: 100px; right: -11px; }
    .e-11 { top: -11px; left: 179px; }
    .e-12 { bottom: -11px; left: 179px; }
    .e-13 { top: 179px; left: -11px; }
    .e-14 { top: 179px; right: -11px; }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>
  <div class="atom-container">
    <div class="nucleus">
      <div class="proton">14 p⁺</div>
      <div class="neutron">14 nº</div>
    </div>
    <div class="orbit orbit-1">
      <div class="electron e-1">e⁻</div>
      <div class="electron e-2">e⁻</div>
    </div>
    <div class="orbit orbit-2">
      <div class="electron e-3">e⁻</div>
      <div class="electron e-4">e⁻</div>
      <div class="electron e-5">e⁻</div>
      <div class="electron e-6">e⁻</div>
      <div class="electron e-7">e⁻</div>
      <div class="electron e-8">e⁻</div>
      <div class="electron e-9">e⁻</div>
      <div class="electron e-10">e⁻</div>
    </div>
    <div class="orbit orbit-3">
      <div class="electron e-11">e⁻</div>
      <div class="electron e-12">e⁻</div>
      <div class="electron e-13">e⁻</div>
      <div class="electron e-14">e⁻</div>
    </div>
  </div>
</body>
</html>
