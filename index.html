<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Átomo de Silicio Animado</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .atom {
      width: min(90vw, 700px);
      aspect-ratio: 1 / 1;
      background: transparent;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* Líneas de las órbitas */
    .orbit {
      fill: none;
      stroke: rgba(120, 120, 120, 0.55);
      stroke-width: 2;
    }

    /* Grupos que contienen los electrones */
    .electron-group {
      transform-box: fill-box;
      transform-origin: center;
    }

    .electron-group.shell-1 {
      animation: orbit1 5s linear infinite;
    }

    .electron-group.shell-2 {
      animation: orbit2 8s linear infinite reverse;
    }

    .electron-group.shell-3 {
      animation: orbit3 11s linear infinite;
    }

    /* Movimiento orbital */
    @keyframes orbit1 {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes orbit2 {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes orbit3 {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Electrones */
    .electron {
      fill: #eeeeee;
      stroke: #777777;
      stroke-width: 1.5;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,.25));
    }

    .electron-symbol {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #444;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    /* Núcleo */
    .nucleus-proton {
      fill: #e64b35;
      stroke: #b72d20;
      stroke-width: 2;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.25));
    }

    .nucleus-neutron {
      fill: #4654b8;
      stroke: #303b91;
      stroke-width: 2;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.25));
    }

    .nucleus-text {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 19px;
      font-weight: 700;
      fill: white;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    /* Respeta la preferencia del usuario si tiene desactivadas las animaciones */
    @media (prefers-reduced-motion: reduce) {
      .electron-group {
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="atom">
    <svg viewBox="0 0 700 700" role="img"
         aria-label="Átomo de silicio animado con 14 electrones, 14 protones y 14 neutrones">

      <!-- Centro del átomo: (350,350) -->

      <!-- Capas electrónicas -->
      <circle class="orbit" cx="350" cy="350" r="105" />
      <circle class="orbit" cx="350" cy="350" r="185" />
      <circle class="orbit" cx="350" cy="350" r="275" />

      <!-- CAPA 1: 2 electrones -->
      <g class="electron-group shell-1">
        <g transform="translate(350 245)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>

        <g transform="translate(350 455)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>
      </g>

      <!-- CAPA 2: 8 electrones -->
      <g class="electron-group shell-2">
        <g transform="translate(350 165)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>

        <g transform="translate(219 219)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>

        <g transform="translate(165 350)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>

        <g transform="translate(219 481)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>

        <g transform="translate(350 535)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>

        <g transform="translate(481 481)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>

        <g transform="translate(535 350)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>

        <g transform="translate(481 219)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>
      </g>

      <!-- CAPA 3: 4 electrones -->
      <g class="electron-group shell-3">
        <g transform="translate(350 75)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>

        <g transform="translate(625 350)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>

        <g transform="translate(350 625)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>

        <g transform="translate(75 350)">
          <circle class="electron" r="22" />
          <text class="electron-symbol" y="1">e⁻</text>
        </g>
      </g>

      <!-- Núcleo: 14 protones y 14 neutrones representados de forma simplificada -->
      <g transform="translate(350 350)">
        <circle class="nucleus-neutron" cx="-38" cy="-28" r="46" />
        <text class="nucleus-text" x="-38" y="-28">14 n⁰</text>

        <circle class="nucleus-proton" cx="38" cy="28" r="46" />
        <text class="nucleus-text" x="38" y="28">14 p⁺</text>
      </g>

    </svg>
  </div>
</body>
</html>
